{% load static %}
<!DOCTYPE html>
<html lang="EN">
    <head>
        <title>contact us</title>
    </head>
    <body>
        
        
        <div class='container'>
        <form method='POST'  id='contactform' onsubimit='subimitform(event)'>
            {% csrf_token %}
        <h2>contact us<h2>
        <label for='name' >username:</label>
        <input type='text' name='username' id='username' required><br>
        <label for='email'>Email:</label>
        <input type='email' name='email' id='email' placeholder='Example@gmail.com' required><br>
        <label for='messages' >Messages:</label>
        <input  type='messages' name='messages' id='messages' placeholder='comment' rows='s' required><br>
        <button type="submit">submit</button>
        <button ><a href='/' style='color:white;'>Return home</a></button>
        </div>
    <style>


         body {
     background-image: url("{% static 'image/pic7.jpg' %}");
        background-size: cover;
        display: flex;
        justify-content: center;
            align-items: center;
           min-height: 100vh;
            font-family: Arial, sans-serif;
        }
    .container{
            position: relative;
            width: 470px;
            height: 490px;
            background-color: transparent;
             border: 20px ;
            border: 25px ;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
                border: 5px solid #cef5f3;
        }
        
    
        label {
            font-size: 30px;
            font-family: Arial, sans-serif;
            color: black;
            background-color:transparent;
        }
        button {
            background-color: blue;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        placeholder {
            color: black;
        }
        button:hover {
            background-color: darkblue;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        h2{
            align-item: center;
            font-size: 40px;
        }


    </style>

       
    </body>
</html>
